name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-check:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install Dependencies
      run: npm ci
    - name: Run Lint & Typecheck
      run: npm test
    - name: Build Production Bundle
      run: npm run build

  backend-test:
    name: Backend Test Suite & Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install System Dependencies (Poppler & OpenCV libs)
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils libgl1 libglib2.0-0
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r orchestrator/requirements.txt
        pip install -r preprocessing_service/requirements.txt
        pip install -r visual_service/requirements.txt
        pip install -r requirements-dev.txt
    - name: Lint with Ruff
      run: |
        ruff check .
    - name: Run Pytest Suite
      env:
        ENV: dev
        FIREWORKS_API_KEY: fake_ci_test_key
      run: |
        pytest tests/ -v --tb=short

  security-audit:
    name: Security & Vulnerability Audits
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install Security Scanners
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit
    - name: Run Bandit Static Code Analysis
      run: |
        bandit -r common orchestrator preprocessing_service visual_service -ll
    - name: Run pip-audit Dependency Vulnerability Scan
      run: |
        pip-audit -r orchestrator/requirements.txt || true
        pip-audit -r preprocessing_service/requirements.txt || true
        pip-audit -r visual_service/requirements.txt || true
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Run npm audit (Production Dependencies)
      working-directory: ./frontend
      run: |
        npm audit --omit=dev --audit-level=high || true
